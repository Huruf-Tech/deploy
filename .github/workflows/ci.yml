name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      DATABASE_URL: mongodb://localhost:27017/huruf-deploy-ci
      BASE_URL: http://localhost:8000
      SECRET_KEY: ci-only-secret
      BETTER_AUTH_CAPABILITIES: email
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check lib schemas scripts tests routes
      - run: deno task check:layers
      - name: Protocol artifacts are up to date
        run: |
          deno task generate:protocol
          git diff --exit-code -- protocol agent/internal/protocol
      - run: deno task setup:dev
      - run: deno task test

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/huruf-deploy-agent
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/huruf-deploy-agent

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run build

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >-
          npx --yes jscpd@4.3.0 lib schemas routes scripts tests public/app/src
          --ignore "**/core/**,**/components/ui/**,**/components/reui/**"
          --min-lines 8 --threshold 3 --reporters console
