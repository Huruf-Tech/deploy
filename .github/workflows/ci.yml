name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Transactions (Better Auth, wallets, quotas) need a replica set: a
      # single-node one, like local development.
      DATABASE_URL: mongodb://localhost:27017/huruf-deploy-ci?directConnection=true
      BASE_URL: http://localhost:8000
      SECRET_KEY: ci-only-secret
      # The tests sign users up.
      BETTER_AUTH_CAPABILITIES: email,signup
      # CI-only key for the keyring (variables, channel secrets); not used anywhere else.
      DEPLOY_MASTER_KEY: OOLKwhwC/bzD+Rr1fxjpQsU6gh9oK5t+tSKoCSe0oZQ=
      # Nothing is mailed from tests: an address nothing listens on.
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "2599"
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci
      SMTP_SENDER_NAME: Huruf Deploy CI
      SMTP_SENDER: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - name: MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "rs.status().myState" | grep -q 1 && break
            sleep 1
          done
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno check lib schemas scripts tests routes
      - run: deno task check:layers
      - name: Protocol artifacts are up to date
        run: |
          deno task generate:protocol
          git diff --exit-code -- protocol agent/internal/protocol
      - run: deno task setup:dev
      - run: deno task test

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/huruf-deploy-agent
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/huruf-deploy-agent

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/app/package-lock.json
      # The app links the generated SDK (file:), and Vite resolves the SDK's
      # imports (axios, path-to-regexp) from its own folder.
      - name: SDK dependencies
        working-directory: public/www/sdk@0.0.1/npm
        run: npm ci --omit=dev --no-audit --no-fund
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm run build

  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: >-
          npx --yes jscpd@4.3.0 lib schemas routes scripts tests public/app/src
          --ignore "**/core/**,**/components/ui/**,**/components/reui/**"
          --min-lines 8 --threshold 3 --reporters console
