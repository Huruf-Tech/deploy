version: "3.9"

services:
  web:
    build: .
    image: __image__
    container_name: huruf-deploy-__environment__
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Written on Traefik's polls; unused without the ingress profile.
      TRAEFIK_CERTS_DIR: /ingress/certs
      FRPS_DIR: /ingress/frps
    volumes:
      - ingress-certs:/ingress/certs
      - ingress-frps:/ingress/frps
    restart: unless-stopped
    mem_limit: 3g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Custom domains (PLAN §14): enable with COMPOSE_PROFILES=ingress, with
  # INGRESS_CONFIG_TOKEN set. Traefik takes ports 80 and 443 unless
  # INGRESS_HTTP_PORT / INGRESS_HTTPS_PORT move it behind another proxy
  # (docs/INGRESS.md), which may pass visitors' IPs with the PROXY protocol.
  traefik:
    image: traefik:v3.5.3
    profiles: ["ingress"]
    restart: unless-stopped
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Only local proxies may say who the visitor is; others are ignored.
      - --entrypoints.web.proxyProtocol.trustedIPs=127.0.0.1/32,172.16.0.0/12
      - --entrypoints.websecure.proxyProtocol.trustedIPs=127.0.0.1/32,172.16.0.0/12
      - --providers.http.endpoint=http://web:8000/ingress/api/traefik
      - --providers.http.pollInterval=5s
      - --providers.http.headers.X-Ingress-Token=${INGRESS_CONFIG_TOKEN}
      - --providers.file.directory=/ingress/certs
      - --providers.file.watch=true
      - --certificatesresolvers.platform.acme.tlschallenge=true
      - --certificatesresolvers.platform.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.platform.acme.storage=/acme/acme.json
    volumes:
      - ingress-certs:/ingress/certs:ro
      - ingress-acme:/acme
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Agents' tunnels arrive on 7000; their ports stay on this network, for Traefik.
  frps:
    image: fatedier/frps:v0.65.0
    profiles: ["ingress"]
    restart: unless-stopped
    ports:
      - "7000:7000"
    working_dir: /ingress/frps
    command: ["-c", "frps.toml"]
    volumes:
      - ingress-frps:/ingress/frps:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ingress-certs:
  ingress-frps:
  ingress-acme:
